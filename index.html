<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DistarArt</title>
    <link rel="stylesheet" href="./css/style.css">
    <script src="./js/main.js" type="module" defer></script>
    <link rel="icon" type="image/png" href="./servidor/imagenes/Logo-DistarArt.ico">
</head>

<body>

    <!-- _____________ SPLASH - PANTALLA INICIAL _____________ -->

    <div class="splash" id="splash">

        <!-- Mosaico de imágenes de fondo -->
        <div class="splash-bg">
            <img src="./servidor/imagenes/inicio/celestial_body_359.jpg" alt="">
            <img src="./servidor/imagenes/inicio/lunexus_982.jpg" alt="">
            <img src="./servidor/imagenes/inicio/esencia_del_bosque_693.jpg" alt="">
            <img src="./servidor/imagenes/inicio/sea_monster_808.jpg" alt="">
            <img src="./servidor/imagenes/inicio/Frog_boi.png" alt="">
            <img src="./servidor/imagenes/inicio/purplefox_548.jpg" alt="">
            <img src="./servidor/imagenes/inicio/fragmented_255.jpg" alt="">
            <img src="./servidor/imagenes/inicio/reflejo_espectral_628.jpg" alt="">
            <img src="./servidor/imagenes/inicio/willow_311.jpg" alt="">
            <img src="./servidor/imagenes/inicio/end_597.jpg" alt="">
            <img src="./servidor/imagenes/inicio/Magic forest.png" alt="">
            <img src="./servidor/imagenes/inicio/lunexus_982.jpg" alt="">
        </div>

        <!-- Degradado oscuro por encima -->
        <div class="splash-gradiente"></div>

        <!-- Contenido centrado -->
        <div class="splash-contenido">
            <img src="./servidor/imagenes/Logo-DistarArt.png" alt="DistarArt" class="splash-logo">
            <h1 class="splash-titulo">DistarArt</h1>
            <p class="splash-tagline">
                Bienvenido al espacio donde la <em>creatividad</em> y la <em>inspiración&nbsp;</em>
                conectan con tu pasión por el arte.
            </p>
            <button class="splash-cta" id="splash-btn-acceder">
                Acceder a la plataforma
                <span class="splash-cta-flecha">→</span>
            </button>
        </div>

        <p class="splash-pulsa">Pulsa en cualquier lugar para entrar</p>

    </div>

    <!-- _____________ MAIN PRINCIPAL _____________ -->

    <main id="main-principal" class="oculto"></main>

</body>

</html>
